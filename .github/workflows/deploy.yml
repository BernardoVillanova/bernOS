name: Deploy BernOS

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: platform/bernos
  CONTAINER_NAME: bernos-app

jobs:
  # -----------------------------------------------------------
  # 1. CI: Validação de Qualidade e Build do Frontend
  # -----------------------------------------------------------
  validate:
    name: Lint & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.0

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Validar build do frontend (Vite + Vue-TSC)
        run: bun run build

  # -----------------------------------------------------------
  # 2. CD: Build da Imagem Docker, Push no ECR e Deploy na EC2
  # Dispara automaticamente quando o PR for mergeado para main/master
  # ou em push direto / workflow_dispatch
  # -----------------------------------------------------------
  deploy:
    name: Build Image & Deploy EC2
    needs: validate
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push da Imagem Docker para o ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy na EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "[Deploy] Iniciando atualização do BernOS..."

            # Autenticar Docker com o ECR na instância
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}

            # Puxar a nova imagem gerada
            docker pull ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

            # Garantir diretório com permissão para o volume persistente do SQLite
            mkdir -p /home/${{ secrets.EC2_USER }}/bernos-data
            chmod 777 /home/${{ secrets.EC2_USER }}/bernos-data

            # Parar e remover container antigo
            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm ${{ env.CONTAINER_NAME }} || true

            # Subir novo container com otimizações para t3a.nano:
            # - Bind apenas em 127.0.0.1 (seguro com Cloudflare Tunnel)
            # - Volume persistente para SQLite
            # - Limite de memória (120M) e rotação de logs para proteger o disco
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              -p 127.0.0.1:3000:3000 \
              -e PORT=3000 \
              -e DATABASE_PATH=/app/data/bernos.db \
              -v /home/${{ secrets.EC2_USER }}/bernos-data:/app/data \
              --log-opt max-size=5m \
              --log-opt max-file=2 \
              --memory=120m \
              ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

            # LIMPEZA OBRIGATÓRIA (CRÍTICA NA T3A.NANO): Remove imagens antigas para poupar os 2GB livres
            docker image prune -af

            echo "[Deploy] BernOS atualizado com sucesso!"
