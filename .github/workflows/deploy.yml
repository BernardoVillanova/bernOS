name: Deploy BernOS

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: platform/bernos
  CONTAINER_NAME: bernos-app

jobs:
  # -----------------------------------------------------------
  # 1. CI: Validação de Qualidade e Build do Frontend
  # -----------------------------------------------------------
  validate:
    name: Lint & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.0

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Validar build do frontend (Vite + Vue-TSC)
        run: bun run build

  # -----------------------------------------------------------
  # 2. CD: Build da Imagem Docker, Push no ECR e Deploy na EC2
  # Dispara automaticamente quando o PR for mergeado para main/master
  # ou em push direto / workflow_dispatch
  # -----------------------------------------------------------
  deploy:
    name: Build Image & Deploy EC2
    needs: validate
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push da Imagem Docker para o ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy na EC2 via SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          mkdir -p ~/.ssh
          # Remove qualquer espaco/indentacao acidental do inicio das linhas da chave
          echo "$EC2_SSH_KEY" | sed 's/^[ \t]*//' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" bash << 'EOF'
            set -e
            echo "[Deploy] Iniciando atualizacao do BernOS..."

            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 008971641425.dkr.ecr.us-east-1.amazonaws.com

            docker pull 008971641425.dkr.ecr.us-east-1.amazonaws.com/platform/bernos:latest

            mkdir -p /home/ubuntu/bernos-data
            chmod 777 /home/ubuntu/bernos-data

            docker stop bernos-app || true
            docker rm bernos-app || true

            docker run -d \
              --name bernos-app \
              --restart unless-stopped \
              -p 127.0.0.1:3000:3000 \
              -e PORT=3000 \
              -e DATABASE_PATH=/app/data/bernos.db \
              -v /home/ubuntu/bernos-data:/app/data \
              --log-opt max-size=5m \
              --log-opt max-file=2 \
              --memory=120m \
              008971641425.dkr.ecr.us-east-1.amazonaws.com/platform/bernos:latest

            docker image prune -af

            echo "[Deploy] BernOS atualizado com sucesso!"
          EOF

