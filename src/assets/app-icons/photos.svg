<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="photosBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f7"/>
    </linearGradient>
    <filter id="petalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Squircle Base with border -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#photosBg)" stroke="#e5e5ea" stroke-width="1.5"/>
  
  <!-- Flower Petals Group centered at (64, 64) -->
  <g transform="translate(64, 64)" filter="url(#petalShadow)">
    <!-- Petal template: capsule with rx="9" -->
    <!-- Top - Yellow -->
    <rect x="-9" y="-42" width="18" height="34" rx="9" fill="#ffd60a" opacity="0.9" />
    <!-- Top Right - Orange -->
    <rect x="-9" y="-42" width="18" height="34" rx="9" fill="#ff9f0a" opacity="0.9" transform="rotate(45)" />
    <!-- Right - Red -->
    <rect x="-9" y="-42" width="18" height="34" rx="9" fill="#ff453a" opacity="0.9" transform="rotate(90)" />
    <!-- Bottom Right - Pink/Magenta -->
    <rect x="-9" y="-42" width="18" height="34" rx="9" fill="#ff375f" opacity="0.9" transform="rotate(135)" />
    <!-- Bottom - Purple -->
    <rect x="-9" y="-42" width="18" height="34" rx="9" fill="#bf5af2" opacity="0.9" transform="rotate(180)" />
    <!-- Bottom Left - Blue -->
    <rect x="-9" y="-42" width="18" height="34" rx="9" fill="#0a84ff" opacity="0.9" transform="rotate(225)" />
    <!-- Left - Teal / Cyan -->
    <rect x="-9" y="-42" width="18" height="34" rx="9" fill="#64d2ff" opacity="0.9" transform="rotate(270)" />
    <!-- Top Left - Green -->
    <rect x="-9" y="-42" width="18" height="34" rx="9" fill="#30d158" opacity="0.9" transform="rotate(315)" />
    <!-- Center white core for subtle polish -->
    <circle cx="0" cy="0" r="10" fill="#ffffff" opacity="0.85"/>
  </g>
</svg>
