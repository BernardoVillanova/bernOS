<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="settingsBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8e8e93"/>
      <stop offset="100%" stop-color="#48484a"/>
    </linearGradient>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f2f2f7"/>
      <stop offset="100%" stop-color="#d1d1d6"/>
    </linearGradient>
    <filter id="gearShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Squircle Base -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#settingsBg)"/>
  
  <!-- Subtle circular groove in base -->
  <circle cx="64" cy="64" r="44" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" fill="none"/>

  <!-- Main Central Gear -->
  <g transform="translate(64, 64)" filter="url(#gearShadow)">
    <!-- 8 Gear Teeth -->
    <g fill="url(#gearGrad)">
      <rect x="-7" y="-38" width="14" height="12" rx="3" />
      <rect x="-7" y="-38" width="14" height="12" rx="3" transform="rotate(45)" />
      <rect x="-7" y="-38" width="14" height="12" rx="3" transform="rotate(90)" />
      <rect x="-7" y="-38" width="14" height="12" rx="3" transform="rotate(135)" />
      <rect x="-7" y="-38" width="14" height="12" rx="3" transform="rotate(180)" />
      <rect x="-7" y="-38" width="14" height="12" rx="3" transform="rotate(225)" />
      <rect x="-7" y="-38" width="14" height="12" rx="3" transform="rotate(270)" />
      <rect x="-7" y="-38" width="14" height="12" rx="3" transform="rotate(315)" />
      <!-- Gear Outer Ring -->
      <circle cx="0" cy="0" r="30" />
    </g>
    <!-- Gear Inner Hole (dark cutout) -->
    <circle cx="0" cy="0" r="14" fill="#48484a" />
    <!-- Gear Axle core -->
    <circle cx="0" cy="0" r="7" fill="#8e8e93" />
  </g>
</svg>
