version: "3.8"

services:
  bernos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bernos-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - GITHUB_USER=BernardoVillanova
      - DATABASE_PATH=/app/data/bernos.db
    volumes:
      - bernos-data:/app/data
    restart: unless-stopped

volumes:
  bernos-data:
